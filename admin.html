<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dispatcher Panel - Preserver Trans LLC</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">

<meta name="theme-color" content="#d4af37">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#080808;
  color:white;
  min-height:100vh;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#24200d 0,#080808 45%);
}

.login-box{
  width:100%;
  max-width:400px;
  background:#121212;
  border:1px solid #d4af37;
  border-radius:20px;
  padding:35px 25px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  text-align:center;
}

.login-logo{
  width:85px;
  height:85px;
  border-radius:18px;
  margin-bottom:15px;
}

.login-box h1{
  color:#d4af37;
  font-size:25px;
}

.login-box p{
  color:#888;
  margin:7px 0 25px;
  font-size:13px;
}

.input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  background:#080808;
  border:1px solid #333;
  border-radius:9px;
  color:white;
  outline:none;
}

.input:focus{
  border-color:#d4af37;
}

.gold-btn{
  width:100%;
  padding:14px;
  background:#d4af37;
  color:#000;
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.gold-btn:hover{
  background:#f0c94d;
}

.error{
  color:#ff6969;
  margin-top:12px;
  font-size:13px;
}

/* DASHBOARD */

#dashboard{
  display:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  border-bottom:1px solid #d4af37;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:48px;
  height:48px;
  border-radius:10px;
}

.brand h1{
  color:#d4af37;
  font-size:20px;
}

.brand p{
  color:#777;
  font-size:11px;
  margin-top:3px;
}

.logout{
  background:#191919;
  color:#d4af37;
  border:1px solid #d4af37;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 20px 60px;
}

.title{
  margin-bottom:20px;
}

.title h2{
  color:#d4af37;
  font-size:27px;
}

.title p{
  color:#777;
  margin-top:5px;
}

/* FORM */

.form-box{
  background:#121212;
  border:1px solid #292929;
  border-radius:15px;
  padding:20px;
  margin-bottom:25px;
}

.form-box h3{
  color:#d4af37;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.form-grid input,
.form-grid select,
.form-grid textarea{
  width:100%;
  padding:13px;
  background:#080808;
  border:1px solid #333;
  border-radius:8px;
  color:white;
  outline:none;
}

.form-grid input:focus,
.form-grid select:focus,
.form-grid textarea:focus{
  border-color:#d4af37;
}

.full{
  grid-column:1 / -1;
}

textarea{
  resize:vertical;
  min-height:80px;
}

.add-btn{
  margin-top:15px;
  width:100%;
  padding:14px;
  background:#d4af37;
  color:#000;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* TRUCKS */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-title h3{
  color:#d4af37;
}

.refresh{
  background:#171717;
  color:#d4af37;
  border:1px solid #444;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}

.trucks{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:17px;
}

.card{
  background:linear-gradient(145deg,#151515,#0c0c0c);
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
}

.card:hover{
  border-color:#d4af37;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.card-top h3{
  color:#d4af37;
}

.status{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.available{
  background:#163b23;
  color:#65e78d;
}

.booked{
  background:#3b3114;
  color:#e9c85d;
}

.notavailable{
  background:#3b1717;
  color:#ff7373;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #222;
  font-size:13px;
}

.label{
  color:#777;
}

.value{
  color:#ddd;
  text-align:right;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.edit{
  flex:1;
  background:#d4af37;
  color:#000;
  border:0;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.delete{
  flex:1;
  background:#261212;
  color:#ff6b6b;
  border:1px solid #542020;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.message{
  text-align:center;
  color:#888;
  padding:30px;
}

/* MOBILE */

@media(max-width:600px){

  header{
    padding:12px 15px;
  }

  .brand h1{
    font-size:16px;
  }

  .brand img{
    width:42px;
    height:42px;
  }

  .container{
    padding:20px 14px 50px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

}

</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

  <div class="login-box">

    <img
      src="./icon-512.png"
      class="login-logo"
      alt="Preserver Trans"
    >

    <h1>Preserver Trans LLC</h1>

    <p>Secure Dispatcher Panel</p>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Dispatcher Email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
    >

    <button
      class="gold-btn"
      onclick="login()"
    >
      🔐 Login
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

<header>

  <div class="brand">

    <img src="./icon-512.png">

    <div>
      <h1>Preserver Trans LLC</h1>
      <p>Dispatcher Management Panel</p>
    </div>

  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</header>


<div class="container">

  <div class="title">

    <h2>Truck Management</h2>

    <p>
      Add and manage your available trucks.
    </p>

  </div>


  <!-- ADD TRUCK -->

  <div class="form-box">

    <h3 id="formTitle">
      ➕ Add New Truck
    </h3>

    <div class="form-grid">

      <input
        id="truck_number"
        placeholder="Truck Number *"
      >

      <input
        id="driver_name"
        placeholder="Driver Name"
      >

      <input
        id="location"
        placeholder="Current Location *"
      >

      <input
        id="available_date"
        type="date"
      >

      <input
        id="available_time"
        type="time"
      >

      <input
        id="lane"
        placeholder="Lane (CA → WA)"
      >

      <input
        id="equipment"
        placeholder="Equipment (53' Dry Van)"
      >

      <select id="status">

        <option value="Available">
          Available
        </option>

        <option value="Booked">
          Booked
        </option>

        <option value="Not Available">
          Not Available
        </option>

      </select>

      <textarea
        id="notes"
        class="full"
        placeholder="Notes"
      ></textarea>

    </div>

    <button
      class="add-btn"
      onclick="saveTruck()"
      id="saveButton"
    >
      ADD TRUCK
    </button>

  </div>


  <!-- TRUCK LIST -->

  <div class="section-title">

    <h3>🚛 All Trucks</h3>

    <button
      class="refresh"
      onclick="loadTrucks()"
    >
      ↻ Refresh
    </button>

  </div>

  <div id="truckList" class="trucks">

    <div class="message">
      Loading trucks...
    </div>

  </div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://lriojwlaxemghavidsjt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HFnwZD1cccBr6RsIDhZPbA_MxHGK0T6";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;


/* LOGIN */

async function login(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const errorBox =
  document.getElementById("loginError");

  errorBox.textContent = "";

  if(!email || !password){

    errorBox.textContent =
    "Please enter email and password.";

    return;
  }

  const {error} =
  await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){

    errorBox.textContent =
    error.message;

    return;
  }

  showDashboard();

}


/* SESSION */

async function checkSession(){

  const {data} =
  await supabaseClient.auth.getSession();

  if(data.session){

    showDashboard();

  }

}


/* SHOW DASHBOARD */

function showDashboard(){

  document.getElementById("loginPage")
    .style.display="none";

  document.getElementById("dashboard")
    .style.display="block";

  loadTrucks();

}


/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* LOAD */

async function loadTrucks(){

  const list =
  document.getElementById("truckList");

  list.innerHTML =
  `<div class="message">Loading trucks...</div>`;

  const {data,error} =
  await supabaseClient
  .from("trucks")
  .select("*")
  .order("id",{ascending:false});

  if(error){

    list.innerHTML =
    `<div class="message">
      Error loading trucks: ${error.message}
    </div>`;

    return;
  }

  if(!data.length){

    list.innerHTML =
    `<div class="message">
      No trucks added yet.
    </div>`;

    return;
  }

  list.innerHTML="";

  data.forEach(truck => {

    const card =
    document.createElement("div");

    card.className="card";

    let statusClass="available";

    if(truck.status==="Booked"){
      statusClass="booked";
    }

    if(truck.status==="Not Available"){
      statusClass="notavailable";
    }

    card.innerHTML=`

      <div class="card-top">

        <h3>
          🚛 #${escapeHTML(truck.truck_number)}
        </h3>

        <span class="status ${statusClass}">
          ${escapeHTML(truck.status || "Available")}
        </span>

      </div>

      <div class="row">
        <span class="label">Driver</span>
        <span class="value">
          ${escapeHTML(truck.driver_name || "-")}
        </span>
      </div>

      <div class="row">
        <span class="label">Location</span>
        <span class="value">
          ${escapeHTML(truck.location || "-")}
        </span>
      </div>

      <div class="row">
        <span class="label">Date</span>
        <span class="value">
          ${escapeHTML(truck.available_date || "-")}
        </span>
      </div>

      <div class="row">
        <span class="label">Time</span>
        <span class="value">
          ${escapeHTML(truck.available_time || "-")}
        </span>
      </div>

      <div class="row">
        <span class="label">Lane</span>
        <span class="value">
          ${escapeHTML(truck.lane || "-")}
        </span>
      </div>

      <div class="row">
        <span class="label">Equipment</span>
        <span class="value">
          ${escapeHTML(truck.equipment || "-")}
        </span>
      </div>

      <div class="row">
        <span class="label">Notes</span>
        <span class="value">
          ${escapeHTML(truck.notes || "-")}
        </span>
      </div>

      <div class="actions">

        <button
          class="edit"
          onclick='editTruck(${JSON.stringify(truck)})'
        >
          ✏️ Edit
        </button>

        <button
          class="delete"
          onclick="deleteTruck(${truck.id})"
        >
          🗑 Delete
        </button>

      </div>

    `;

    list.appendChild(card);

  });

}


/* SAVE */

async function saveTruck(){

  const truck={

    truck_number:
    document.getElementById("truck_number").value.trim(),

    driver_name:
    document.getElementById("driver_name").value.trim(),

    location:
    document.getElementById("location").value.trim(),

    available_date:
    document.getElementById("available_date").value,

    available_time:
    document.getElementById("available_time").value,

    lane:
    document.getElementById("lane").value.trim(),

    equipment:
    document.getElementById("equipment").value.trim(),

    status:
    document.getElementById("status").value,

    notes:
    document.getElementById("notes").value.trim()

  };


  if(!truck.truck_number || !truck.location){

    alert("Truck Number and Location are required.");

    return;
  }


  let result;


  if(editingId){

    result =
    await supabaseClient
    .from("trucks")
    .update(truck)
    .eq("id",editingId);

  }else{

    result =
    await supabaseClient
    .from("trucks")
    .insert(truck);

  }


  if(result.error){

    alert(result.error.message);

    return;
  }


  alert(
    editingId
    ? "Truck updated successfully!"
    : "Truck added successfully!"
  );


  resetForm();

  loadTrucks();

}


/* EDIT */

function editTruck(truck){

  editingId=truck.id;

  document.getElementById("formTitle")
    .textContent="✏️ Edit Truck";

  document.getElementById("saveButton")
    .textContent="UPDATE TRUCK";

  document.getElementById("truck_number").value =
    truck.truck_number || "";

  document.getElementById("driver_name").value =
    truck.driver_name || "";

  document.getElementById("location").value =
    truck.location || "";

  document.getElementById("available_date").value =
    truck.available_date || "";

  document.getElementById("available_time").value =
    truck.available_time || "";

  document.getElementById("lane").value =
    truck.lane || "";

  document.getElementById("equipment").value =
    truck.equipment || "";

  document.getElementById("status").value =
    truck.status || "Available";

  document.getElementById("notes").value =
    truck.notes || "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DELETE */

async function deleteTruck(id){

  if(!confirm(
    "Are you sure you want to delete this truck?"
  )){
    return;
  }

  const {error} =
  await supabaseClient
  .from("trucks")
  .delete()
  .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  loadTrucks();

}


/* RESET */

function resetForm(){

  editingId=null;

  document.getElementById("formTitle")
    .textContent="➕ Add New Truck";

  document.getElementById("saveButton")
    .textContent="ADD TRUCK";

  document.getElementById("truck_number").value="";
  document.getElementById("driver_name").value="";
  document.getElementById("location").value="";
  document.getElementById("available_date").value="";
  document.getElementById("available_time").value="";
  document.getElementById("lane").value="";
  document.getElementById("equipment").value="";
  document.getElementById("status").value="Available";
  document.getElementById("notes").value="";

}


/* ESCAPE */

function escapeHTML(value){

  return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* SERVICE WORKER */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
    .register("./sw.js")
    .catch(error =>
      console.log("SW error:",error)
    );

  });

}


/* START */

checkSession();

</script>

</body>
</html>
